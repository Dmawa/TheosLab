name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  toolchain:
    name: Provision Alpine toolchain (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout Theos Lab
        uses: actions/checkout@v4

      - name: Checkout IshEmbed (for fakefsify + supervisor)
        run: |
          git clone --depth 1 --branch v0.3.3 --recurse-submodules --shallow-submodules \
            https://github.com/Lolendor/ish-arm64-pkg.git /tmp/ish-arm64-pkg
          git -C /tmp/ish-arm64-pkg submodule status | head -5

      - name: Provision toolchain inside Alpine 3.19 (arm64)
        run: |
          docker run --rm -i \
            -v "$PWD:/repo" \
            -v /tmp/ish-arm64-pkg:/ish \
            -v /tmp/out:/out \
            alpine:3.19 /bin/sh -eu <<'EOS'
          apk add --no-cache bash git curl ca-certificates make perl \
              clang17 lld llvm17 llvm17-dev dpkg fakeroot coreutils findutils \
              xz tar rsync file zip build-base meson ninja musl-dev gcc radare2 \
              sqlite-dev libarchive-dev pkgconf

          echo "==> Install zig (needed by iSH supervisor Makefile)"
          ZIGVER=0.13.0
          curl -fL "https://ziglang.org/download/${ZIGVER}/zig-linux-aarch64-${ZIGVER}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

          echo "==> Provision Theos toolchain (guest = this container)"
          bash /repo/Scripts/provision-toolchain.sh

          echo "==> Build OLLVM pass"
          bash /repo/Scripts/build-ollvm.sh /out/Toolchain

          echo "==> Build iSH supervisor (ishsv)"
          make -C /ish/supervisor OUT_DIR=/tmp/supervisor

          echo "==> Build fakefsify host tool"
          meson setup /tmp/ish-host /ish/third_party/ish
          meson compile -C /tmp/ish-host fakefsify

          echo "==> Stage provisioned rootfs"
          STAGE=/tmp/stage
          mkdir -p "$STAGE"
          tar -C / -cf - \
              --exclude='./proc' --exclude='./sys' --exclude='./dev' \
              --exclude='./tmp' --exclude='./run' --exclude='./work' \
              --exclude='./out' --exclude='./ish' --exclude='./repo' \
              --exclude='./mnt' --exclude='./media' \
              --exclude='./root/.cache' --exclude='./var/cache/*' \
              --exclude='./var/log/*' --exclude='./etc/mtab' \
              . | tar -C "$STAGE" -xf -

          echo "==> Inject supervisor + guest DNS/apk pins (as build-rootfs.sh does)"
          mkdir -p "$STAGE/sbin"
          cp /tmp/supervisor/ishsv "$STAGE/sbin/ishsv"
          chmod 755 "$STAGE/sbin/ishsv"
          mkdir -p "$STAGE/srv/vms/.template/etc" "$STAGE/etc"
          cat > "$STAGE/etc/resolv.conf" <<'RESOLV'
          nameserver 1.1.1.1
          nameserver 8.8.8.8
          nameserver 9.9.9.9
          options timeout:2 attempts:2
          RESOLV
          cat > "$STAGE/etc/apk/repositories" <<APK
          https://dl-cdn.alpinelinux.org/alpine/v3.19/main
          https://dl-cdn.alpinelinux.org/alpine/v3.19/community
          APK
          echo ish > "$STAGE/etc/hostname"

          echo "==> Repack and fakefsify"
          cd "$STAGE" && tar -czf /tmp/root.tar.gz .
          rm -rf /out/fs
          /tmp/ish-host/tools/fakefsify /tmp/root.tar.gz /out/fs

          echo "==> Validate fakefs"
          test -f /out/fs/meta.db
          test -f /out/fs/data/opt/.theoslab-ready
          test -f /out/fs/data/usr/bin/zip
          test -f /out/fs/data/opt/theos/makefiles/common.mk

          echo "==> Package"
          cd /out
          tar -czf theoslab-toolchain.tar.gz fs Toolchain
          sha256sum theoslab-toolchain.tar.gz > SHA256SUMS
          ls -lh
          EOS

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: theoslab-toolchain
          path: |
            /tmp/out/theoslab-toolchain.tar.gz
            /tmp/out/SHA256SUMS
          retention-days: 7
          compression-level: 0

  ipa:
    name: Build unsigned IPA
    needs: toolchain
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout Theos Lab
        uses: actions/checkout@v4

      - name: Download toolchain artifact
        uses: actions/download-artifact@v4
        with:
          name: theoslab-toolchain
          path: /tmp/toolchain

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Assemble Generated/Guest
        run: |
          tar -xzf /tmp/toolchain/theoslab-toolchain.tar.gz -C /tmp/toolchain
          mkdir -p Generated/Guest
          ditto /tmp/toolchain/fs Generated/Guest/fs
          ditto /tmp/toolchain/Toolchain Generated/Guest/Toolchain
          ls Generated/Guest/fs
          du -sh Generated/Guest

      - name: Generate Xcode project
        run: ./Scripts/prepare.sh

      - name: Build (unsigned)
        run: |
          xcodebuild -project TheosLab.xcodeproj -scheme TheosLab \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build \
            | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TheosLab.app Payload/TheosLab.app
          zip -qry TheosLab-unsigned.ipa Payload
          ls -lh TheosLab-unsigned.ipa
          shasum -a 256 TheosLab-unsigned.ipa > TheosLab-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheosLab-unsigned-ipa
          path: |
            TheosLab-unsigned.ipa
            TheosLab-unsigned.ipa.sha256
          retention-days: 30
          compression-level: 0
