name: test-macos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-macos.yml']

jobs:
  mac14:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - run: uname -a && sw_vers

  mac15:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - run: uname -a && sw_vers
